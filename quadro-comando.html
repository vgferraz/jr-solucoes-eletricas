<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de Placa · Quadro Elétrico · JR Soluções Elétricas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --orange:#f2751a;
    --success:#3ac26c;
    --error:#e5484d;
    --bg-app:#121316;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg-app);
    font-family:'Inter',sans-serif;
    color:#f5f6f7;
    min-height:100vh;
    padding:24px 14px 60px;
  }

  /* ===== TOOLBAR ===== */
  .toolbar{
    max-width:640px;
    margin:0 auto 18px;
    background:#1c1d20;
    border:1px solid #2a2b2f;
    border-radius:16px;
    padding:16px 18px;
  }
  .toolbar h1{
    font-size:15.5px;
    font-weight:700;
    margin:0 0 4px;
  }
  .toolbar p.hint{ margin:0; font-size:12px; line-height:1.4; color:#9a9ea5; }
  .toolbar-text{ min-width:0; }
  .toolbar-row{
    display:flex;
    flex-wrap:wrap;
    gap:16px;
    align-items:center;
    justify-content:space-between;
  }
  .btn-download{
    margin-left:auto;
    background:linear-gradient(135deg,var(--orange),#c95a10);
    color:#fff;
    border:none;
    font-weight:700;
    font-size:13.5px;
    padding:11px 18px;
    border-radius:10px;
    cursor:pointer;
    box-shadow:0 4px 14px rgba(242,117,26,.28);
    transition:transform .12s ease;
  }
  .btn-download:hover{ transform:translateY(-1px); }
  .btn-download.loading{ opacity:.7; pointer-events:none; }
  .toast{
    max-width:640px;
    margin:0 auto 12px;
    background:#12261b;
    border:1px solid var(--success);
    color:#8be3ab;
    font-size:12.5px;
    font-weight:700;
    padding:9px 14px;
    border-radius:10px;
    display:none;
    align-items:center;
    gap:8px;
  }
  .toast.show{ display:flex; }

  /* ===== PLACA (imagem real + overlays) ===== */
  #plate-wrap{
    max-width:640px;
    margin:0 auto;
  }
  #plate{
    position:relative;
    width:100%;
    container-type:inline-size;
    line-height:0;
  }
  #plate > img.base{
    width:100%;
    height:auto;
    display:block;
    border-radius:18px;
  }

  .patch{
    position:absolute;
    background:#111213;
  }

  .field{
    position:absolute;
    display:flex;
    align-items:center;
    color:#f2f2f0;
    font-weight:700;
    letter-spacing:.2px;
    outline:none;
    border-radius:4px;
    overflow:hidden;
    white-space:nowrap;
    cursor:text;
    transition:box-shadow .12s ease, background .12s ease;
  }
  .field:hover{ box-shadow:0 0 0 1.5px rgba(242,117,26,.55); background:rgba(242,117,26,.08); }
  .field:focus{ box-shadow:0 0 0 1.5px var(--orange); background:rgba(242,117,26,.12); white-space:normal; overflow:visible; }

  .field.value{ font-size:2.00cqw; }
  .field.contact{ font-size:1.45cqw; font-weight:500; }

  #qr-patch{ background:#fdfdfc; border-radius:2px; }
  #qrcode{
    position:absolute;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  #qrcode img{ width:90%; height:90%; display:block; }

  @media (max-width:480px){
    .toolbar-row{ gap:8px; }
    .btn-download{ font-size:12.5px; padding:10px 14px; }
  }
</style>
</head>

<script>
function onlyDigits(str){ return (str || '').replace(/\D/g, ''); }

function buildQrUrl(){
  const digits = onlyDigits(document.getElementById('v-phone').innerText);
  const withCountry = digits.startsWith('55') ? digits : '55' + digits;
  return 'https://wa.me/' + withCountry;
}

function renderQr(){
  const container = document.getElementById('qrcode');
  container.innerHTML = '';
  const box = container.getBoundingClientRect();
const size = Math.max(60, Math.round(box.width * 0.90));
  new QRCode(container, {
    text: buildQrUrl(),
    width: size,
    height: size,
    colorDark: '#000000',
    colorLight: '#fdfdfc',
    correctLevel: QRCode.CorrectLevel.M
  });
}

document.getElementById('v-phone').addEventListener('input', () => renderQr());

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
}

function baixarImagem(){
  const btn = document.getElementById('btn-download');
  btn.classList.add('loading');
  btn.textContent = 'Gerando imagem...';
  html2canvas(document.getElementById('plate'), {
    backgroundColor: '#0a0a0b',
    scale: 3,
    useCORS: true
  }).then(canvas => {
    const link = document.createElement('a');
    link.download = 'placa-quadro-eletrico-jr-solucoes-eletricas.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
    btn.classList.remove('loading');
    btn.innerHTML = '⬇ Baixar Imagem (PNG)';
    showToast('✓ Placa baixada com sucesso');
  }).catch(() => {
    btn.classList.remove('loading');
    btn.innerHTML = '⬇ Baixar Imagem (PNG)';
    showToast('✕ Não foi possível gerar a imagem');
  });
}

window.addEventListener('load', renderQr);
window.addEventListener('resize', renderQr);
</script>
